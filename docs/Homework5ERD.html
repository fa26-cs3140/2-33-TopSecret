        <text x="417.5" y="218" font-size="12"></text><text x="380" y="212">1 : many</text><text x="50" y="330">Agent facility_id references facilities.id; ON DELETE RESTRICT. Each agent has exactly one facility.</text><text x="50" y="357">* Blank strings represent optional death date and notes. Dates are ISO text; adapter validates input.</text><text x="50" y="385">Foreign keys must be enabled on every writer connection. Briefs are independent of missions.</text><text x="50" y="730">Audit content_id is a historical, polymorphic reference, not a foreign key. Credentials remain in a ciphered file.</text><text x="50" y="759">Pending Member C: mission-to-facility and mission-to-agent relationships are absent in the current schema.</text><text x="25" y="824">See homework5-member-b.txt for interface contracts, regression steps and outstanding team requirements.</text>
