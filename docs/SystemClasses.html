<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Top Secret - SystemClasses</title><style>@page{size:A3 landscape;margin:0}html,body{margin:0;font-family:Arial,sans-serif;color:#18334f}svg{display:block;width:420mm;height:297mm;break-after:page;break-inside:avoid}svg:last-child{break-after:auto}text{font:17px Arial,sans-serif;fill:#18334f}.title{font-size:27px;font-weight:bold}.box-title{font-size:19px;font-weight:bold}.label{font-size:15px}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="System classes - application and content">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">System classes - application and content</text><text x="30" y="73">Homework 8 | Member B delivered; remaining blocks planned | November 23, 2026</text>
    <g><rect x="30" y="115" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="144" class="box-title">TopSecret / LaunchMode</text>
    <text x="44" y="178">main: initialize storage, authentication and services</text><text x="44" y="203">-web -&gt; HttpWebServer; terminal -&gt; UserInterface</text><text x="44" y="228">-h / --help -&gt; usage without creating storage</text></g><g><rect x="650" y="115" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="144" class="box-title">UserInterface / ContentMenu</text>
    <text x="664" y="178">Uses ContentController for reads, links and search</text><text x="664" y="203">ContentService: terminal content edits and relations</text><text x="664" y="228">MessageMenu / SessionMenu: optional menu features</text></g><path d="M570 185H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="575" y="170" class="label">constructs</text><g><rect x="30" y="365" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="394" class="box-title">ContentController : WebEditingWorkflow</text>
    <text x="44" y="428">+ sessionFor / list / read / audit / search</text><text x="44" y="453">+ newForm / editForm / create / update</text><text x="44" y="478">Authorizes edits; validates fields and relationships</text><text x="44" y="503">Builds WebEditForm for the view</text></g><g><rect x="650" y="365" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="394" class="box-title">ContentService &lt;&lt;interface&gt;&gt;</text>
    <text x="664" y="428">+ list / read / add / update / delete / audit</text><text x="664" y="453">+ addMission / setFacility / assignAgent / attachBrief</text><text x="664" y="478">+ countryFor / setCountry; related lookups / search</text><text x="664" y="503">Returns ContentEntry, ContentHit and ContentType</text></g><path d="M570 450H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="591" y="435" class="label">uses</text><g><rect x="30" y="665" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="694" class="box-title">SqliteContentService : ContentService</text>
    <text x="44" y="728">Imports countries, facilities, agents and briefs</text><text x="44" y="753">Enforces AccessControl and relationship integrity</text><text x="44" y="778">Content mutation + audit write in one transaction</text></g><g><rect x="650" y="665" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="694" class="box-title">AuditLogRepository / SqliteAuditLogRepository</text>
    <text x="664" y="728">AuditLogEntry: event, content, ID, user, timestamp</text><text x="664" y="753">READ / CREATE / UPDATE / DELETE events</text><text x="664" y="778">Content types plus SESSION; no messaging audit</text></g><path d="M570 695L650 500" fill="none" stroke="#25476a" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="580" y="610" class="label">implements</text><path d="M570 740H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="590" y="726" class="label">audit</text><text x="30" y="850" class="label">Solid arrows: dependency. Dashed open arrows: interface realization. Selected operations are shown.</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="System classes - HTTP, forms and sessions">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">System classes - HTTP, forms and sessions</text><text x="30" y="73">Shared authentication and navigation apply to editing and messaging.</text>
    <g><rect x="30" y="115" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="144" class="box-title">HttpWebServer : WebServerController</text>
    <text x="44" y="178">+ start / address / close (safe to repeat)</text><text x="44" y="203">Authenticates every protected route, refreshes session</text><text x="44" y="228">Delegates to WebEditingHandler / WebMessageHandler</text><text x="44" y="253">ContentController supplies current role and records</text></g><g><rect x="650" y="115" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="144" class="box-title">WebAuthentication / StoredWebAuthentication</text>
    <text x="664" y="178">StoredWebAuthentication implements WebAuthentication</text><text x="664" y="203">+ hasAccounts / authenticate</text><text x="664" y="228">Uses AuthenticationService and ciphered credentials</text><text x="664" y="253">Login issues token; logout invalidates token</text></g><path d="M570 205H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="590" y="190" class="label">uses</text><g><rect x="30" y="390" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="419" class="box-title">WebSessionStore / SqliteWebSessionStore</text>
    <text x="44" y="453">SqliteWebSessionStore implements WebSessionStore</text><text x="44" y="478">+ create / usernameFor / invalidate / clear</text><text x="44" y="503">Also implements SessionAdministration</text><text x="44" y="528">SQLite token, username, created_at, last_seen</text><text x="44" y="553">Sliding inactivity timeout: more than 30 minutes</text></g><path d="M300 271V390" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="310" y="337" class="label">uses persistent store</text><g><rect x="650" y="390" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="419" class="box-title">SessionAdmin / SessionMenu</text>
    <text x="664" y="453">SessionMenu -&gt; SessionAdmin -&gt; SessionAdministration</text><text x="664" y="478">+ list(session) / revoke(token, session): admin only</text><text x="664" y="503">WebSessionInfo: full token, username and times</text><text x="664" y="528">Revocation removes token; audit records SESSION</text><text x="664" y="553">InMemoryWebSessionStore remains a test alternative</text></g><path d="M650 490H570" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="590" y="475" class="label">uses</text><g><rect x="30" y="680" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="709" class="box-title">WebEditingHandler / WebFormData</text>
    <text x="44" y="743">Handler -&gt; WebEditingWorkflow -&gt; WebEditForm</text><text x="44" y="768">WebFormData: UTF-8, duplicates, 8192-byte limit</text><text x="44" y="793">Login, editing and messaging share the parser</text></g><g><rect x="650" y="680" width="540" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="709" class="box-title">HtmlView / ContentText</text>
    <text x="664" y="743">HtmlView: login, menu, records, search, audit, forms</text><text x="664" y="768">Link / Field / AuditRow / Nav nested display records</text><text x="664" y="793">Shared CSS and escaped HTML; no JS or images</text></g><text x="30" y="850" class="label">Session / Role / AccessControl determine capabilities. Accounts and passwords are managed in the terminal.</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="System classes - private web messaging">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">System classes - private web messaging</text><text x="30" y="73">Every signed-in user can send; only the matching addressee can read.</text>
    <g><rect x="30" y="115" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="144" class="box-title">WebMessageHandler</text>
    <text x="44" y="178">HttpWebServer supplies authenticated Session + token</text><text x="44" y="203">GET inbox / new / view; POST send / open</text><text x="44" y="228">Session-bound CSRF; shared WebFormData parser</text><text x="44" y="253">Successful POST -&gt; 303 redirect -&gt; GET</text></g><g><rect x="650" y="115" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="144" class="box-title">MessageService &lt;&lt;interface&gt;&gt;</text>
    <text x="664" y="178">+ recipients(session) / send(agentId, body, session)</text><text x="664" y="203">+ inbox(session): List&lt;Message&gt;</text><text x="664" y="228">+ message(id, session): Optional&lt;Message&gt;</text><text x="664" y="253">+ markRead(id, session): boolean</text></g><path d="M570 200H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="590" y="185" class="label">uses</text><g><rect x="30" y="405" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="434" class="box-title">MessageHtmlView</text>
    <text x="44" y="468">+ inbox / compose / detail / error / withNav</text><text x="44" y="493">Uses HtmlView.shell for shared CSS and navigation</text><text x="44" y="518">Escapes message text, names and form values</text><text x="44" y="543">Inbox shows Read / Unread and Open buttons</text></g><path d="M300 271V405" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="313" y="344" class="label">renders</text><g><rect x="650" y="405" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="434" class="box-title">SqliteMessageService : MessageService</text>
    <text x="664" y="468">Scopes reads to username = agents.name (ignore case)</text><text x="664" y="493">Adds nullable read_at to existing messages tables</text><text x="664" y="518">First owned POST open sets read_at once</text><text x="664" y="543">Foreign or missing message IDs both return not found</text></g><path d="M920 405V271" fill="none" stroke="#25476a" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="936" y="344" class="label">implements</text><g><rect x="30" y="695" width="540" height="106" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="724" class="box-title">MessageMenu</text>
    <text x="44" y="758">Terminal send and personal inbox use MessageService</text><text x="44" y="783">Terminal reading does not change web read state</text></g><g><rect x="650" y="695" width="540" height="106" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="724" class="box-title">Message &lt;&lt;immutable&gt;&gt;</text>
    <text x="664" y="758">id, agentId, agentName, sender, body, createdAt</text><text x="664" y="783">readAt: nullable timestamp of the first web open</text></g><path d="M920 561V695" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="936" y="644" class="label">returns</text><text x="30" y="850" class="label">Expiry and revocation reject messaging before reads or writes. Read state persists across server restarts.</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="System classes - complete production type index">

"160" transform="translate(0 96)">MissionSearchException</text><text x="430" y="160" transform="translate(0 120)">MissionSearchService</text><text x="430" y="160" transform="translate(0 144)">Role</text><text x="430" y="160" transform="translate(0 168)">Session</text><text x="430" y="160" transform="translate(0 192)">SessionAdmin</text><text x="430" y="160" transform="translate(0 216)">SessionAdministration</text><text x="430" y="160" transform="translate(0 240)">SqliteAuditLogRepository</text><text x="430" y="160" transform="translate(0 264)">SqliteContentService</text><text x="430" y="160" transform="translate(0 288)">SqliteMessageService</text><text x="430" y="160" transform="translate(0 312)">SqliteMissionRepository</text><text x="430" y="160" transform="translate(0 336)">SubstitutionCipher</text><text x="430" y="160" transform="translate(0 360)">WebSessionInfo</text><text x="830" y="125" class="box-title">controller</text><text x="830" y="160" transform="translate(0 0)">ContentController</text><text x="830" y="160" transform="translate(0 24)">HttpWebServer</text><text x="830" y="160" transform="translate(0 48)">InMemoryWebSessionStore</text><text x="830" y="160" transform="translate(0 72)">LaunchMode</text><text x="830" y="160" transform="translate(0 96)">ProgramControl</text><text x="830" y="160" transform="translate(0 120)">ProgramControlException</text><text x="830" y="160" transform="translate(0 144)">ProgramControlImpl</text><text x="830" y="160" transform="translate(0 168)">SqliteWebSessionStore</text><text x="830" y="160" transform="translate(0 192)">StoredWebAuthentication</text><text x="830" y="160" transform="translate(0 216)">WebAuthentication</text><text x="830" y="160" transform="translate(0 240)">WebEditForm</text><text x="830" y="160" transform="translate(0 264)">WebEditingHandler</text><text x="830" y="160" transform="translate(0 288)">WebEditingWorkflow</text><text x="830" y="160" transform="translate(0 312)">WebFormData</text><text x="830" y="160" transform="translate(0 336)">WebMessageHandler</text><text x="830" y="160" transform="translate(0 360)">WebServerController</text><text x="830" y="160" transform="translate(0 384)">WebSessionStore</text><text x="830" y="160" transform="translate(0 408)">WebValidationException</text><text x="430" y="620" class="box-title">view</text><text x="430" y="651">AnimatedEffects</text><text x="430" y="673">ContentMenu</text><text x="430" y="695">ContentText</text><text x="430" y="717">Effects</text><text x="430" y="739">HtmlView</text><text x="430" y="761">MessageHtmlView</text><text x="430" y="783">MessageMenu</text><text x="430" y="805">MissionBriefJson</text><text x="430" y="827">SessionMenu</text><text x="430" y="849">UserInterface</text><text x="830" y="670" class="box-title">Application entry point</text><text x="830" y="704">TopSecret</text><text x="30" y="850" class="label">Nested HtmlView records: Link, Field, AuditRow, Nav. Interfaces, enums and exceptions are included in this index.</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="System classes - mission brief workflow">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">System classes - mission brief workflow</text><text x="30" y="73">Homework 8 Member B: features c and f. Existing content and authentication boundaries are reused.</text>
    <g><rect x="30" y="130" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="159" class="box-title">HttpWebServer -&gt; WebEditingHandler</text>
    <text x="44" y="193">Mission detail: Add brief (admin), Download JSON (reader)</text><text x="44" y="218">GET /new?type=briefs&amp;mission_id=N preselects mission</text><text x="44" y="243">POST /create checks current role, CSRF and fields</text><text x="44" y="268">Validation errors retain mission and entered values</text><text x="44" y="293">Success redirects back to the selected mission</text></g><g><rect x="650" y="130" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="159" class="box-title">ContentController -&gt; ContentService</text>
    <text x="664" y="193">+ createBrief(values, missionId, session)</text><text x="664" y="218">Reuses brief field and date validation</text><text x="664" y="243">+ addBrief(values, missionId, session): int</text><text x="664" y="268">SqliteContentService inserts brief with mission FK</text><text x="664" y="293">Brief and CREATE audit row commit in one transaction</text></g><path d="M570 245H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="590" y="230" class="label">calls</text><g><rect x="30" y="475" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="504" class="box-title">Authenticated mission export</text>
    <text x="44" y="538">GET /mission-briefs?mission_id=N</text><text x="44" y="563">ContentController.read(MISSION) rejects missing IDs</text><text x="44" y="588">briefsFor(N) selects and audits only attached briefs</text><text x="44" y="613">Stable order: ascending brief identifier</text><text x="44" y="638">No-store; JSON attachment filename uses numeric ID</text></g><g><rect x="650" y="475" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="504" class="box-title">MissionBriefJson</text>
    <text x="664" y="538">+ encode(missionId, briefs): String</text><text x="664" y="563">Array of {id, mission_id, title, date, text}</text><text x="664" y="588">Escapes quotes, backslashes and all controls</text><text x="664" y="613">Preserves Unicode; HTTP encodes as UTF-8</text><text x="664" y="638">Empty mission produces []</text></g><path d="M570 590H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="580" y="575" class="label">encodes</text><text x="30" y="850" class="label">No second form renderer, separate export SQL or schema migration. Existing unlinked brief creation remains available.</text></svg></body></html>
