<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Top Secret - DatabaseERD</title><style>@page{size:A3 landscape;margin:0}html,body{margin:0;font-family:Arial,sans-serif;color:#18334f}svg{display:block;width:420mm;height:297mm;break-after:page;break-inside:avoid}svg:last-child{break-after:auto}text{font:17px Arial,sans-serif;fill:#18334f}.title{font-size:27px;font-weight:bold}.box-title{font-size:19px;font-weight:bold}.label{font-size:15px}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="Database ERD - content and relationships">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">Database ERD - content and relationships</text><text x="30" y="73">PK = primary key | FK = foreign key | NN = NOT NULL | arrows point to referenced rows</text>
    <g><rect x="30" y="115" width="350" height="106" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="144" class="box-title">countries</text>
    <text x="44" y="178">PK id INTEGER</text><text x="44" y="203">name TEXT NN</text></g><g><rect x="435" y="115" width="350" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="449" y="144" class="box-title">facilities</text>
    <text x="449" y="178">PK id INTEGER</text><text x="449" y="203">name TEXT NN</text><text x="449" y="228">abbreviation TEXT NN</text><text x="449" y="253">FK country_id INTEGER NULL</text></g><g><rect x="840" y="115" width="350" height="206" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="854" y="144" class="box-title">agents</text>
    <text x="854" y="178">PK id INTEGER</text><text x="854" y="203">name TEXT NN</text><text x="854" y="228">date_of_birth TEXT NN</text><text x="854" y="253">date_of_death TEXT NN</text><text x="854" y="278">notes TEXT NN</text><text x="854" y="303">FK facility_id INTEGER NN</text></g><path d="M435 185H380" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="387" y="171" class="label">0..1</text><path d="M840 185H785" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="805" y="171" class="label">1</text><g><rect x="30" y="415" width="350" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="444" class="box-title">missions</text>
    <text x="44" y="478">PK id INTEGER AUTOINCREMENT</text><text x="44" y="503">title TEXT NN</text><text x="44" y="528">brief TEXT NN</text><text x="44" y="553">date TEXT NN</text></g><g><rect x="435" y="415" width="350" height="106" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="449" y="444" class="box-title">mission_facilities</text>
    <text x="449" y="478">PK/FK mission_id INTEGER</text><text x="449" y="503">FK facility_id INTEGER NN</text></g><g><rect x="840" y="415" width="350" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="854" y="444" class="box-title">mission_agents</text>
    <text x="854" y="478">PK/FK mission_id INTEGER NN</text><text x="854" y="503">PK/FK agent_id INTEGER NN</text><text x="854" y="528">Composite primary key</text></g><path d="M435 480H380" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="405" y="468" class="label">1</text><path d="M610 415V271" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="620" y="360" class="label">facility</text><path d="M1015 415V321" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="1027" y="370" class="label">agent</text><path d="M840 530L805 595H400L380 530" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="595" y="585" class="label">mission</text><g><rect x="30" y="665" width="350" height="131" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="694" class="box-title">briefs</text>
    <text x="44" y="728">PK id INTEGER; title TEXT NN</text><text x="44" y="753">date TEXT NN; text TEXT NN</text><text x="44" y="778">FK mission_id INTEGER NULL</text></g><path d="M205 665V571" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="220" y="625" class="label">0..1 mission</text><text x="435" y="675">Country 1 -> 0..* facilities; facility 1 -> 0..* agents.</text><text x="435" y="710">Mission has exactly 1 facility and 1..* agents.</text><text x="435" y="745">Agent may serve 0..* missions; mission has 0..* briefs.</text><text x="435" y="780">Triggers protect a mission's facility and last agent.</text><text x="30" y="850" class="label">HW8 B: addBrief inserts briefs.mission_id + CREATE audit atomically. No migration; mission delete sets FK to NULL.</text></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 880" role="img" aria-label="Database ERD - messages, audit and web sessions">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="white" stroke="#25476a"/></marker></defs>
    <text x="30" y="40" class="title">Database ERD - messages, audit and web sessions</text><text x="30" y="73">All tables share data/missions.db; credentials and roles remain in data/credentials.cip.</text>
    <g><rect x="30" y="115" width="540" height="181" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="144" class="box-title">messages</text>
    <text x="44" y="178">PK id INTEGER AUTOINCREMENT</text><text x="44" y="203">FK agent_id INTEGER NN -&gt; agents.id</text><text x="44" y="228">sender TEXT NN; body TEXT NN</text><text x="44" y="253">created_at TEXT NN (ISO local date/time)</text><text x="44" y="278">read_at TEXT NULL (first web open)</text></g><g><rect x="650" y="115" width="540" height="156" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="144" class="box-title">agents (referenced content entity)</text>
    <text x="664" y="178">One agent receives zero or more messages</text><text x="664" y="203">Deleting an agent cascades to its messages</text><text x="664" y="228">Inbox ownership: case-insensitive name = username</text><text x="664" y="253">No foreign key to the external credential file</text></g><path d="M570 230H650" fill="none" stroke="#25476a"  marker-end="url(#arrow)"/>
    <text x="588" y="215" class="label">agent</text><g><rect x="30" y="435" width="540" height="206" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="44" y="464" class="box-title">audit_log</text>
    <text x="44" y="498">PK id INTEGER AUTOINCREMENT</text><text x="44" y="523">event_type TEXT NN; content_type TEXT NN</text><text x="44" y="548">content_id INTEGER NN; username TEXT NN</text><text x="44" y="573">timestamp TEXT NN</text><text x="44" y="598">READ / CREATE / UPDATE / DELETE</text><text x="44" y="623">No FK: history survives deletion; SESSION uses ID 0</text></g><g><rect x="650" y="435" width="540" height="206" rx="6" fill="#f4f7fb" stroke="#25476a"/>
    <text x="664" y="464" class="box-title">web_sessions</text>
    <text x="664" y="498">PK token TEXT (random 256-bit, base64url)</text><text x="664" y="523">username TEXT NN</text><text x="664" y="548">created_at INTEGER NN (epoch milliseconds)</text><text x="664" y="573">last_seen INTEGER NN (epoch milliseconds)</text><text x="664" y="598">No FK: usernames refer to credential file accounts</text><text x="664" y="623">Terminal admins list and revoke full issued tokens</text></g><text x="30" y="750">read_at migration preserves existing messages; NULL means unread. Reopening keeps the original time.</text><text x="30" y="785">Sessions expire after >30 idle minutes; activity refreshes last_seen. Logout/revocation/stop remove sessions.</text><text x="30" y="850" class="label">Messages are excluded from audit. Content writes and their audit rows commit atomically; session revocation is audited separately.</text></svg></body></html>
