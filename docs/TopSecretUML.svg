<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; }
      .box { fill: #f7fafc; stroke: #334155; stroke-width: 2; rx: 6; }
      .interface { fill: #eef6ff; stroke: #1e40af; stroke-width: 2; rx: 6; }
      .memberb { fill: #fff7ed; stroke: #b45309; stroke-width: 2; rx: 6; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .impl { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#triangle); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#f8fafc" stroke="#475569"/>
    </marker>
  </defs>

  <text x="40" y="44" class="title">Top Secret Homework 4 Class Diagram</text>
  <text x="40" y="70" class="small">Interfaces separate authentication, storage, database access, search, and menu control.</text>

  <rect x="500" y="100" width="200" height="86" class="box"/>
  <text x="600" y="128" text-anchor="middle" class="label">TopSecret</text>
  <text x="520" y="154" class="small">+ main(args)</text>
  <text x="520" y="174" class="small">+ run(args, in, out, auth, ui)</text>

  <rect x="120" y="245" width="255" height="118" class="memberb"/>
  <text x="247" y="273" text-anchor="middle" class="label">AuthenticationService</text>
  <text x="140" y="299" class="small">+ createCredentials(user, pass)</text>
  <text x="140" y="319" class="small">+ authenticate(user, pass)</text>
  <text x="140" y="339" class="small">+ changePassword(...)</text>

  <rect x="112" y="445" width="270" height="120" class="interface"/>
  <text x="247" y="473" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; CredentialStore</text>
  <text x="136" y="501" class="small">+ exists(): boolean</text>
  <text x="136" y="521" class="small">+ read(): Credential</text>
  <text x="136" y="541" class="small">+ write(Credential): void</text>

  <rect x="112" y="650" width="270" height="98" class="memberb"/>
  <text x="247" y="678" text-anchor="middle" class="label">FileCredentialStore</text>
  <text x="136" y="706" class="small">data/credentials.cip</text>
  <text x="136" y="726" class="small">ciphered with ciphers/key.txt</text>

  <rect x="468" y="245" width="265" height="118" class="box"/>
  <text x="600" y="273" text-anchor="middle" class="label">UserInterface</text>
  <text x="492" y="299" class="small">+ run(args): String</text>
  <text x="492" y="319" class="small">+ runMenu(in, out): void</text>
  <text x="492" y="339" class="small">lists, reads, searches, exits</text>

  <rect x="850" y="235" width="250" height="138" class="interface"/>
  <text x="975" y="263" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; ProgramControl</text>
  <text x="875" y="291" class="small">+ listMissions()</text>
  <text x="875" y="311" class="small">+ getMissionContents(id)</text>
  <text x="875" y="331" class="small">+ searchMissions(query)</text>
  <text x="875" y="351" class="small">+ listFiles()</text>

  <rect x="850" y="450" width="250" height="118" class="box"/>
  <text x="975" y="478" text-anchor="middle" class="label">ProgramControlImpl</text>
  <text x="875" y="506" class="small">connects UI to missions</text>
  <text x="875" y="526" class="small">keeps file/cipher legacy path</text>
  <text x="875" y="546" class="small">does not own storage</text>

  <rect x="484" y="450" width="235" height="118" class="interface"/>
  <text x="602" y="478" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; MissionSearch</text>
  <text x="512" y="506" class="small">+ search(query): List&lt;Mission&gt;</text>
  <text x="512" y="526" class="small">case-insensitive brief search</text>

  <rect x="484" y="650" width="235" height="98" class="box"/>
  <text x="602" y="678" text-anchor="middle" class="label">MissionSearchService</text>
  <text x="512" y="706" class="small">searches brief text only</text>
  <text x="512" y="726" class="small">returns matching missions</text>

  <rect x="850" y="650" width="250" height="120" class="interface"/>
  <text x="975" y="678" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; MissionRepository</text>
  <text x="875" y="706" class="small">+ initialize(): void</text>
  <text x="875" y="726" class="small">+ getAllMissions()</text>
  <text x="875" y="746" class="small">+ getMission(id)</text>

  <rect x="850" y="820" width="250" height="70" class="box"/>
  <text x="975" y="848" text-anchor="middle" class="label">SqliteMissionRepository</text>
  <text x="875" y="876" class="small">only class using java.sql</text>

  <rect x="484" y="820" width="235" height="70" class="box"/>
  <text x="602" y="848" text-anchor="middle" class="label">Mission</text>
  <text x="512" y="876" class="small">id, title, brief, date</text>

  <rect x="112" y="820" width="270" height="70" class="interface"/>
  <text x="247" y="848" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; FileHandler</text>
  <text x="136" y="876" class="small">reads data, keys, TSV text</text>

  <rect x="1160" y="100" width="280" height="98" class="interface"/>
  <text x="1300" y="128" text-anchor="middle" class="label">&lt;&lt;interface&gt;&gt; Effects</text>
  <text x="1180" y="154" class="small">+ banner(out): void</text>
  <text x="1180" y="174" class="small">+ loading(out, message): void</text>
  <text x="1180" y="192" class="small" style="font-size:11px">NONE = silent default used by tests</text>

  <rect x="1160" y="260" width="280" height="98" class="box"/>
  <text x="1300" y="288" text-anchor="middle" class="label">AnimatedEffects</text>
  <text x="1180" y="314" class="small">green banner, spinner animation</text>
  <text x="1180" y="334" class="small">used by TopSecret.main</text>

  <path class="arrow" d="M540 186 L305 245"/>
  <path class="arrow" d="M600 186 L600 245"/>
  <path class="arrow" d="M700 143 L975 235"/>
  <path class="arrow" d="M247 363 L247 445"/>
  <path class="impl" d="M247 650 L247 565"/>
  <path class="arrow" d="M247 748 L247 820"/>
  <path class="arrow" d="M733 304 L850 304"/>
  <path class="impl" d="M975 450 L975 373"/>
  <path class="arrow" d="M850 500 L719 500"/>
  <path class="arrow" d="M975 568 L975 650"/>
  <path class="impl" d="M602 650 L602 568"/>
  <path class="arrow" d="M719 699 L850 699"/>
  <path class="impl" d="M975 820 L975 770"/>
  <path class="arrow" d="M850 855 L719 855"/>
  <path class="arrow" d="M975 890 L975 915 L247 915 L247 890"/>

  <path class="arrow" d="M690 245 L690 215 L1230 215 L1230 198"/>
  <path class="impl" d="M1370 260 L1370 198"/>

  <text x="395" y="233" class="small">uses</text>
  <text x="615" y="224" class="small">uses</text>
  <text x="774" y="202" class="small">starts</text>
  <text x="260" y="410" class="small">uses</text>
  <text x="258" y="613" class="small">implements</text>
  <text x="258" y="790" class="small">reads and writes through</text>
  <text x="768" y="291" class="small">calls</text>
  <text x="986" y="414" class="small">implements</text>
  <text x="754" y="487" class="small">uses</text>
  <text x="987" y="612" class="small">uses</text>
  <text x="613" y="613" class="small">implements</text>
  <text x="754" y="687" class="small">uses</text>
  <text x="986" y="802" class="small">implements</text>
  <text x="738" y="842" class="small">returns</text>
  <text x="560" y="908" class="small">imports TSV through</text>
  <text x="950" y="208" class="small">uses (visual effects)</text>
  <text x="1380" y="236" class="small">implements</text>
</svg>
